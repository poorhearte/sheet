<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>여행을 떠나요 (A·G·D 코드, 마디 정렬)</title>
<style>
  @page { size: A4; margin: 0; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  :root { --ly: 22px; --ch: 16px; --a: #C00000; --g: #0057B8; --d: #1E7B34; --line: #555; }
  /* 새 글꼴: 한글 = 나눔스퀘어 네오(굵게 쓰는 글자는 한 단계 더 굵게), 코드 글자 = Atkinson Hyperlegible (파일은 ../fonts/) */
  @font-face { font-family: "NanumSquareNeo"; font-weight: 400 700; src: url("../fonts/NanumSquareNeo-dEb.woff2") format("woff2"); }
  @font-face { font-family: "NanumSquareNeo"; font-weight: 800 900; src: url("../fonts/NanumSquareNeo-eHv.woff2") format("woff2"); }
  @font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400 900; src: url("../fonts/AtkinsonHyperlegible-Bold.ttf") format("truetype"); }
  html, body { margin: 0; background: #fff; color: #000; font-family: "NanumSquareNeo", "Malgun Gothic", "맑은 고딕", sans-serif; }
  .page { box-sizing: border-box; width: 210mm; height: 297mm; margin: 0 auto; padding: 0 6mm 1mm; overflow: hidden; } /* 가사가 작은 곡: 제목 위·마지막 줄 아래 여백 최소 (rule.txt 8) */
  .title { position: relative; display: flex; justify-content: center; align-items: baseline; gap: 16px; margin-bottom: 4px; }
  /* 첫 마디가 바로 코드로 시작해 코드 안내를 넣을 빈 마디가 없으므로 제목 왼쪽 위에 표시 */
  .legend { position: absolute; left: 0; top: 0; font-size: 15px; font-weight: 800; line-height: 1.15; }
  /* 새 글꼴은 제목이 낮아 조 안내(3줄)가 첫 줄 코드와 겹치므로, 제목 칸 높이를 조 안내 높이만큼 확보 */
  .title { min-height: calc(15px * 1.15 * 3 + 2px); }
  h1 { font-size: 34px; margin: 0; }
  h2 { margin: 0; }
  /* 제목 오른쪽 정보: 가수·년도 / 원곡 조 를 두 줄로 */
  .title { align-items: center; }
  .info { font-size: 18px; font-weight: bold; line-height: 1.3; white-space: nowrap; }
  /* 한 줄 = 같은 폭의 4마디 */
  .row { display: grid; grid-template-columns: repeat(4, 1fr); margin-bottom: 4px; } /* 줄 사이 여백 최소 */
  .row:last-child { margin-bottom: 0; }
  .m { display: flex; min-width: 0; }
  .part { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .ch { position: relative; border-bottom: 2px solid var(--line); padding: 0 0 3px 6px; }
  .ch i { font-family: "Atkinson Hyperlegible", Arial, sans-serif; display: block; height: calc(var(--ch) * 1.02); font-size: var(--ch); font-style: normal; font-weight: 800; line-height: 1; }
  .ch i.a { color: var(--a); }
  .ch i.g { color: var(--g); }
  .ch i.d { color: var(--d); }
  /* 코드 번호(도수): 코드 오른쪽에 같은 크기, 진한 회색 */
  /* 코드 번호(도수)는 진한 동그라미 안에 흰 숫자로 써서 눈에 잘 띄게 */
  /* 동그라미는 코드 줄 높이(고정)와 칸 폭 계산에 들어가지 않으므로, 키워도 가사·코드 크기는 그대로 */
  .ch i .deg { display: inline-block; margin-left: 0.25em; width: 1.3em; height: 1.3em; line-height: 1.3em; border-radius: 50%; background: #777; color: #fff; font-size: 0.95em; text-align: center; vertical-align: -0.05em; }
  /* 마디선: 가로줄을 가로지르는 짧은 세로선 */
  .m > .part:first-child .ch::before, .m.last > .part:last-child .ch::after { content: ""; position: absolute; bottom: -8px; height: 26px; width: 2px; background: var(--line); }
  .m > .part:first-child .ch::before { left: 0; }
  .m.last > .part:last-child .ch::after { right: 0; }
  .m.end > .part:last-child .ch::after { width: 4px; box-shadow: -6px 0 0 -1px var(--line); }
  /* 가사: 굵은 글씨, 글자 간격을 살짝 좁힘. 두 절이 있는 곳은 위아래 두 줄 */
  .lys { padding: 1px 2px 0 4px; } /* 코드 가로선과 가사 사이 최소 */
  .ly { display: flex; gap: 4px; font-size: var(--ly); font-weight: bold; line-height: 1.2; white-space: nowrap; letter-spacing: -0.04em; }
  .ly .next { margin-left: auto; text-align: right; }
  /* 나눔스퀘어 네오는 띄어쓰기가 좁아 단어가 붙어 보이므로 단어 사이를 넓힘 */
  .ly { word-spacing: 0.3em; }
  /* 4/4박자의 각 박(1·2·3·4박) 첫 가사: 글자 뒤에 형광 노랑 V 표시 */
  .ly { position: relative; z-index: 0; }
  .ly em { position: relative; font-style: normal; }
  .ly em::before { content: "V"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: -1;
    font-family: Arial, sans-serif; font-size: 1.25em; font-weight: 900; color: #FFEB3B; letter-spacing: 0; }
  /* "-"(끌거나 쉬는 박)는 작게, 뒤의 V 표시는 원래 크기 그대로 (1.25em ÷ 0.6) */
  .ly em.beat { display: inline-block; min-width: 1em; text-align: center; font-size: 0.6em; }
  .ly em.beat::before { font-size: 2.08em; }
  /* 글자 박끼리 붙지 않게 오른쪽에 조금 띄움 */
  .part:not(.rest) .lys { padding-right: 0.3em; }
  /* 코드 글자는 칸 폭을 차지하지 않고 옆 칸으로 이어서 보이게 (rule.txt 8) */
  .ch i { white-space: nowrap; width: 0; }
  /* 전주 첫 줄은 가사 줄이 없으므로, 박자표 아래 숫자가 다음 줄과 겹치지 않을 만큼만 높이를 남김 */
  .has-time .lys { min-height: calc(var(--ch) * 0.85 * 1.25 * 0.5 + 2px); }
  /* 가사를 폭은 그대로 두고 세로로만 늘림 (--sy 배) */
  .ly { height: calc(var(--ly) * 1.2 * var(--sy, 1)); }
  .ly span { display: inline-block; transform: scaleY(var(--sy, 1)); transform-origin: top; }
  /* 박자표: 마디선 바로 뒤에서 가로줄을 가운데에 두고 위아래로 숫자 표시 */
  .time { position: absolute; left: 6px; top: 100%; transform: translateY(-50%); font-size: calc(var(--ch) * 0.85); font-weight: bold; line-height: 1.25; text-align: center; }
  .has-time .ch, .has-time .lys { padding-left: calc(var(--ch) * 0.85 + 12px); }
</style>
</head>
<body>
<div class="page">
  <div class="title"><div class="legend"></div><h1>여행을 떠나요</h1><div class="info"><div>조용필 (1985) 로큰롤</div><div>원곡: E major (E장조) key</div></div></div>
  <div id="song"></div>
</div>
<script>
// 한 줄에 4마디씩, 마디 폭은 모두 같게 표시 (rule.txt 6)
// [코드]는 마디 첫 박부터 적용(원본 E코드 기준)
// 4/4박자: 한 마디를 네 칸(1·2·3·4박)으로 나누고, 칸마다 첫 글자에 V 표시 ("^"는 박 구분, 쉬거나 끄는 박은 "-")
// 박 위치는 145_여행을떠나요_E코드.png의 가사 글자 위치로 추정
//   (같은 가락은 같은 박 위치로 맞춤. 예: 5글자 구절 "배낭을 메고" → 쉼^배^낭을^메고)
// 가사가 두 절인 곳은 "1절 | 2절"로 위아래 두 줄에 표시
// 코드와 마디는 145_여행을떠나요_E코드.png 기준 (전주 8마디 포함, 구역 표시 INT/A/A'/B는 넣지 않음)
// B 부분은 원본에서 두 줄 가사가 같아서 한 줄로 씀
const TIME = "4/4";
const measures = [
  // 전주 (가사가 없는 마디는 가사 줄 없이 코드만)
  "[A]", "[A]", "[E]", "[E]",
  "[B7]", "[B7]", "[E]", "[E]-^푸^른 언^덕에",
  // A
  "[E]-^-^-^-", "[E]-^배^낭을^메고", "[E]-^-^-^-", "[E]-^-^황^금 빛",
  "[A]태^양^-^-", "[A]-^축^제를^여는", "[E]-^-^-^-", "[E]-^광야^를 향^해서",
  "[B7]-^-^-^-", "[B7]-^계곡^을 향^해서", "[E]-^-^-^-", "[E]-^먼^동이^트는",
  // A'
  "[E]-^-^-^-", "[E]-^이^른 아^침에 | -^깊^은 산^중에", "[E]-^-^-^-", "[E]-^-^도^시의 | -^-^시^원한",
  "[A]소^음^-^- | 바^람^-^-", "[A]-^수^많은^사람 | -^나^를 반^기네", "[E]-^-^-^-", "[E]-^빌^딩 숲^속을 | -^하^늘을^보며",
  "[B7]-^-^-^-", "[B7]-^벗^어나^봐요 | -^노^래 부^르세", "[E]-^-^-^-", "[E]-^-^메^아리 | -^-^메^아리",
  // B
  "[A]소리^가^들^려오", "[A]는^계^곡속^의", "[E]흐르^는^물^찾아", "[E]-^-^그^곳으",
  "[B7]로^-^-^-", "[B7]여행^을^떠^나요", "[E]-^-^-^-", "[E]-^-^메^아리",
  "[A]소리^가^들^려오", "[A]는^계^곡속^의", "[E]흐르^는^물^찾아", "[E]-^-^그^곳으",
  "[B7]로^-^-^-", "[B7]여행^을^떠^나요", "[E]-^-^-^-", "[E]-^-^굽이^또 굽이",
];
const rows = [];
for (let i = 0; i < measures.length; i += 4) rows.push(measures.slice(i, i + 4));

// 원본 E코드를 기준으로 반음 단위로 옮김 (E→A: +5, E→G: +3, E→D: -2)
const NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const FLAT = { Db: "C#", Eb: "D#", Gb: "F#", Ab: "G#", Bb: "A#" };
function transpose(chord, steps) {
  const m = chord.match(/^([A-G][#b]?)(.*)$/);
  const root = FLAT[m[1]] || m[1];
  return NOTES[(NOTES.indexOf(root) + steps + 12) % 12] + m[2];
}
// 코드 줄 순서: 위에서부터 D·G·A
const KEYS = [["d", -2, "D장조: D G A"], ["g", 3, "G장조: G C D"], ["a", 5, "A장조: A D E"]];
// 1·4·5 곡이라 7코드는 7을 빼고 기본 코드로 표시 (rule.txt 3), 예: B7 → B
const label = c => c.replace(/7$/, "");
// 가장 아래 코드 줄(D코드)에만 코드 번호(도수)를 오른쪽에 붙임: D=1, G=4, A=5
const DEGREE_KEY = "d", DEGREE_ROOT = "D";
const DEGREES = { 0: "1", 2: "2", 4: "3", 5: "4", 7: "5", 9: "6", 11: "7" };
function degree(chord) {
  const r = chord.match(/^[A-G][#b]?/)[0];
  return DEGREES[(NOTES.indexOf(FLAT[r] || r) - NOTES.indexOf(DEGREE_ROOT) + 12) % 12] || "";
}
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

document.querySelector(".legend").innerHTML = KEYS.map(([cls, , name]) => `<div style="color:var(--${cls})">${name}</div>`).join("");

const song = document.getElementById("song");
rows.forEach((measures, r) => {
  const row = document.createElement("div");
  row.className = "row";
  measures.forEach((text, i) => {
    const m = document.createElement("div");
    const isLastOfSong = r === rows.length - 1 && i === measures.length - 1;
    m.className = "m" + (i === measures.length - 1 ? " last" : "") + (isLastOfSong ? " end" : "");
    const [, chord, lyric] = text.match(/^\[([^\]]+)\]\s*(.*)$/);
    // 절마다 네 박으로 나눔
    const verses = lyric ? lyric.split("|").map(v => v.trim().split("^").map(b => b.trim())) : []; // 가사가 없으면(전주) 가사 줄 없음
    // 박의 첫 글자(또는 "-")에 V 표시
    const markAccent = s => {
      let done = false;
      return [...s].map(c => {
        if (!done && /[가-힣-]/.test(c)) { done = true; return `<em${c === "-" ? ' class="beat"' : ""}>${esc(c)}</em>`; }
        return esc(c);
      }).join("");
    };
    const chordText = (steps, cls) => {
      const c = transpose(chord, steps);
      return label(c) + (cls === DEGREE_KEY ? `<span class="deg">${degree(c)}</span>` : "");
    };
    for (let k = 0; k < 4; k++) {
      const p = document.createElement("div");
      const first = r === 0 && i === 0 && k === 0;
      p.className = "part" + (first ? " has-time" : "");
      // 모든 절이 "-"(쉬거나 끄는 박)뿐인 칸은 좁게, 글자가 있는 칸은 넓게 (rule.txt 8)
      const beatLines = verses.map(v => v[k] || "-");
      const isRest = beatLines.every(s => /^-*$/.test(s));
      p.style.flex = isRest ? "0.25 1 auto" : "1 1 auto";
      if (isRest) { p.classList.add("rest"); p.style.minWidth = "calc(var(--ly) * 1.5)"; } // V끼리 붙지 않게
      const time = first ? `<span class="time">${TIME.replace("/", "<br>")}</span>` : "";
      const lines = beatLines.map(s => `<div class="ly"><span>${markAccent(s)}</span></div>`).join("");
      // 코드는 마디 첫 박에만 표시
      p.innerHTML = `<div class="ch">${time}${KEYS.map(([cls, steps]) => `<i class="${cls}">${k === 0 ? chordText(steps, cls) : ""}</i>`).join("")}</div>`
        + `<div class="lys">${lines}</div>`;
      m.appendChild(p);
    }
    row.appendChild(m);
  });
  song.appendChild(row);
});

// 새 글꼴을 다 불러온 뒤에 크기를 계산 (불러오기 전 맑은 고딕으로 재면 크기가 틀어짐)
Promise.all([document.fonts.load('bold 20px NanumSquareNeo'), document.fonts.load('800 20px "Atkinson Hyperlegible"')]).then(() => {
// 가사가 줄바꿈 없이 마디 안에 들어가고, A4 한 장의 높이에 맞는 가장 큰 글자 크기를 찾음 (rule.txt 8)
const page = document.querySelector(".page");
const root = document.documentElement.style;
const lyEls = [...document.querySelectorAll(".ly")];
const chEls = [...document.querySelectorAll(".ch")];
// 높이는 악보 맨 아래 위치로 확인 (V 표시가 마지막 줄 아래로 조금 나와 scrollHeight가 부풀려지므로 12px 여유만 둠)
const songEl = document.getElementById("song");
const fitsH = () => songEl.getBoundingClientRect().bottom <= page.getBoundingClientRect().bottom - parseFloat(getComputedStyle(page).paddingBottom) - 6;
function fits(ly, ch) {
  root.setProperty("--ly", ly + "px");
  root.setProperty("--ch", ch.toFixed(1) + "px");
  return chEls.every(c => c.scrollWidth <= c.closest(".m").clientWidth) && lyEls.every(l => l.scrollWidth <= l.clientWidth) && fitsH();
}
// 줄이 많아 높이가 부족한 곡(가사가 작은 곡)이라, 코드를 가사보다 조금 작게(0.8배) 묶어서 맞춤 (rule.txt 8)
for (let ly = 30; ly >= 9; ly -= 0.25) {
  if (fits(ly, ly * 0.8)) break;
}
// 가로 폭과 코드 크기는 그대로 두고, 페이지 높이에 맞는 만큼 가사를 세로로 늘림 (최대 3배)
for (let sy = 3; sy > 1; sy -= 0.05) {
  root.setProperty("--sy", sy.toFixed(2));
  if (fitsH()) break;
}
// 마지막 줄 아래에 남는 높이는 코드를 키우는 데 씀 (가사 크기는 그대로)
{
  const ly = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--ly"));
  let ch = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--ch"));
  while (fits(ly, ch + 0.1)) ch += 0.1;
  fits(ly, ch);
}
});
</script>
</body>
</html>
