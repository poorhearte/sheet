<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>등대지기 (A·G·D 코드)</title>
<style>
  @page { size: A4; margin: 0; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  :root { --ly: 26px; --ch: 18px; --a: #C00000; --g: #0057B8; --d: #1E7B34; }
  html, body { margin: 0; background: #fff; color: #000; font-family: "Malgun Gothic", "맑은 고딕", sans-serif; }
  .page { box-sizing: border-box; width: 210mm; height: 297mm; margin: 0 auto; padding: 8mm 9mm 6mm; overflow: hidden; }
  .title { display: flex; justify-content: center; align-items: baseline; gap: 16px; margin-bottom: 8px; }
  h1 { font-size: 34px; margin: 0; }
  h2 { margin: 0; }
  .verse { display: inline-block; font-size: 17px; font-weight: bold; color: #444; margin: 0 0 4px; padding: 2px 10px; border: 2px solid #444; border-radius: 10px; }
  .stanza { margin-bottom: 12px; }
  .line { margin: 0 0 5px; line-height: 1; white-space: nowrap; }
  .seg { display: inline-block; vertical-align: bottom; }
  .seg i { display: block; height: calc(var(--ch) * 1.02); font-size: var(--ch); font-style: normal; font-weight: 800; padding-right: 4px; }
  .seg i.a { color: var(--a); }
  .seg i.g { color: var(--g); }
  .seg i.d { color: var(--d); }
  .seg span { display: block; font-size: var(--ly); font-weight: bold; white-space: pre; }
  .bar { display: inline-block; vertical-align: bottom; box-sizing: border-box; width: 2px; height: calc(var(--ch) * 3.06 + var(--ly)); margin: 0 5px -2px; background: #666; }
  .line > .bar:first-child { margin-left: -12px; }
  .time { display: inline-flex; flex-direction: column; vertical-align: bottom; margin: 0 10px -2px 0; font-family: "Times New Roman", serif; font-size: calc(var(--ly) * 1.15); font-weight: bold; line-height: 0.85; text-align: center; }
  .bar.end { width: 7px; background: none; border-left: 2px solid #666; border-right: 4px solid #333; }
</style>
</head>
<body>
<div class="page">
  <div class="title"><h1>등대지기</h1><h2>영국 민요 · 고은 작사</h2></div>
  <div id="song"></div>
</div>
<script>
// [코드]는 바로 뒤 음절 위에 표시(A코드 기준), | 는 마디선, || 는 끝마디선
// 코드는 145_A코드_등대지기.png, 마디(6/8)는 145_G코드_등대지기.png 악보 기준
const song = [
  ["1절", [
    "{6/8}[@]얼|[A]어붙은 달|[D]그-림[A]자 물|결 위에 차-|[E]며-",
    "한|[A]겨울에 거|[D]센-파[A]도 모|으는 [E]작-은|[A]섬-",
    "생|[E]각하라 저|[A]등대를 지|[D]키는 [A]사-람|[E]의-",
    "거|[A]룩하고 아|[D]름-다[A]운 사|랑의 [E]마-음|[A]을-",
  ]],
  ["2절", [
    "바|[A]람소리 울|[D]부-짖[A]는 어|두운 바-다|[E]에-",
    "깜|[A]박이며 지|[D]새-우[A]는 기|나긴 [E]밤-하|[A]늘-",
    "생|[E]각하라 저|[A]바다를 지|[D]키는 [A]사-람|[E]의-",
    "거|[A]룩하고 아|[D]름-다[A]운 사|랑의 [E]마-음|[A]을-||",
  ]],
];

// A코드를 기준으로 반음 단위로 옮김 (A→G: -2, A→D: +5)
const NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const FLAT = { Db: "C#", Eb: "D#", Gb: "F#", Ab: "G#", Bb: "A#" };
function transpose(chord, steps) {
  const m = chord.match(/^([A-G][#b]?)(.*)$/);
  const root = FLAT[m[1]] || m[1];
  return NOTES[(NOTES.indexOf(root) + steps + 12) % 12] + m[2];
}
const KEYS = [["a", 0, "A코드"], ["g", -2, "G코드"], ["d", 5, "D코드"]];
// 7코드는 괄호로 감싸서 표시, 예: (A7)
const label = c => /7$/.test(c) ? `(${c})` : c;

const root = document.getElementById("song");
for (const [name, lines] of song) {
  const stanza = document.createElement("div");
  stanza.className = "stanza";
  stanza.innerHTML = `<div class="verse">${name}</div>`;
  root.appendChild(stanza);
  for (const line of lines) {
    const div = document.createElement("div");
    div.className = "line";
    // {6/8} 같은 표시는 줄 맨 앞에 박자표로 표시
    const ts = line.match(/^\{(\d+)\/(\d+)\}/);
    if (ts) {
      const time = document.createElement("span");
      time.className = "time";
      time.innerHTML = `<span>${ts[1]}</span><span>${ts[2]}</span>`;
      div.appendChild(time);
    }
    for (const part of line.replace(/^\{\d+\/\d+\}/, "").split(/(\|\|?)|(?=\[)/).filter(Boolean)) {
      if (part[0] === "|") {
        const bar = document.createElement("span");
        bar.className = part === "||" ? "bar end" : "bar";
        div.appendChild(bar);
        continue;
      }
      const m = part.match(/^\[([^\]]+)\](.*)$/);
      const seg = document.createElement("span");
      seg.className = "seg";
      // [@]는 코드 대신 각 줄이 어느 조의 코드인지 이름을 표시
      const chordText = (steps, name) => !m ? "" : m[1] === "@" ? name : label(transpose(m[1], steps));
      seg.innerHTML = KEYS.map(([cls, steps, name]) => `<i class="${cls}">${chordText(steps, name)}</i>`).join("") + "<span></span>";
      seg.lastChild.textContent = m ? m[2] : part;
      div.appendChild(seg);
    }
    stanza.appendChild(div);
  }
}

// A4 한 장의 폭과 높이에 맞을 때까지 글자 크기를 줄임
const page = document.querySelector(".page");
const lineEls = [...document.querySelectorAll(".line")];
for (let ly = 40; ly >= 14; ly -= 0.5) {
  document.documentElement.style.setProperty("--ly", ly + "px");
  document.documentElement.style.setProperty("--ch", (ly * 0.74).toFixed(1) + "px");
  const tooWide = lineEls.some(l => l.scrollWidth > l.clientWidth);
  if (!tooWide && page.scrollHeight <= page.clientHeight) break;
}
</script>
</body>
</html>
