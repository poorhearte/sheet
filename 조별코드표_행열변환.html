<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>조별 코드표 (행열 변환) - 장조·단조</title>
<style>
  /* A4 세로 한 장에 장조 표(위)와 단조 표(아래) 두 개를 인쇄: 표마다 페이지 높이의 절반 */
  @page { size: A4; margin: 0; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { margin: 0; background: #fff; color: #000; font-family: "Malgun Gothic", "맑은 고딕", sans-serif; }
  .page { box-sizing: border-box; width: 210mm; height: 297mm; margin: 0 auto; padding: 7mm 8mm; overflow: hidden;
          display: flex; flex-direction: column; gap: 5mm; }
  .block { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  /* 표 제목: 장조 / 단조 */
  .caption { font-size: 16px; font-weight: bold; margin: 0 0 2mm 2px; }
  .caption small { font-size: 12px; font-weight: normal; color: #444; margin-left: 6px; }
  table { border-collapse: collapse; table-layout: fixed; width: 100%; flex: 1 1 0; }
  th, td { border: 1px solid #9aa3b5; text-align: center; vertical-align: middle; }
  thead th { background: #e6e6e6; font-size: 15px; font-weight: bold; padding: 3px 1px; line-height: 1.15; height: 22%; }
  thead th small { display: block; font-size: 10px; font-weight: normal; color: #333; line-height: 1.2; margin-top: 3px; white-space: nowrap; letter-spacing: -0.04em; }
  thead th.corner { background: #fff; border-top-color: #fff; border-left-color: #fff; width: 12%; }
  .minor thead th { background: #e6e6e6; }
  .minor thead th.corner { background: #fff; }
  tbody th { background: #f0f0f0; font-size: 12px; padding: 2px 1px; line-height: 1.15; }
  .minor tbody th { background: #f0f0f0; }
  tbody th .sig { display: block; font-size: 16px; font-weight: bold; line-height: 1.1; letter-spacing: 1px; color: #000; margin-top: 1px; }
  tbody th .rel { display: block; font-size: 9px; font-weight: normal; color: #555; }
  td { font-size: 28px; padding: 0 1px; letter-spacing: -0.02em; }
  /* dim 코드는 길어서 칸에 닿지 않게 "dim"만 작게 */
  td .dim { font-size: 0.7em; letter-spacing: -0.03em; }
  /* 반음 표시: 반음 거리인 두 화음 사이 세로줄을 빨간 굵은 선으로, 머리칸 경계 위에 "반음" 딱지 */
  .half { border-right: 3px solid #d00; }
  thead th.half { position: relative; }
  thead th.half::after { content: "반음"; position: absolute; right: 0; top: 3px; transform: translateX(50%); z-index: 1;
                         background: #d00; color: #fff; font-size: 10px; font-weight: bold; line-height: 1; padding: 2px 3px; border-radius: 3px; white-space: nowrap; }
  /* D·G·A장조의 1·4·5도 화음: 145 악보의 조 색(D 초록 #1E7B34, G 파랑 #0057B8, A 빨강 #C00000)을 밝은 형광펜 색으로 */
  .hl { padding: 0.02em 0.4em; border-radius: 0.6em 0.25em 0.7em 0.3em; transform: rotate(-1.5deg); display: inline-block; }
  .hl-D { background: rgba(80, 230, 120, 0.55); }
  .hl-G { background: rgba(70, 175, 255, 0.5); }
  .hl-A { background: rgba(255, 90, 115, 0.45); }
</style>
</head>
<body>
<div class="page">
  <div class="block">
    <div class="caption">장조(Major Key)</div>
    <table><thead id="majorHead"></thead><tbody id="majorBody"></tbody></table>
  </div>
  <div class="block minor">
    <div class="caption">단조(Minor Key)<small>자연단음계 · 같은 줄의 장조와 조표가 같은 나란한조</small></div>
    <table><thead id="minorHead"></thead><tbody id="minorBody"></tbody></table>
  </div>
</div>
<script>
const majorDegrees = [
  ["1도 화음", "으뜸화음/Tonic"],
  ["2도 화음", "윗으뜸화음/Super Tonic"],
  ["3도 화음", "가온화음/Mediant"],
  ["4도 화음", "버금딸림화음/Sub Dominant"],
  ["5도 화음", "딸림화음/Dominant"],
  ["6도 화음", "버금가온화음/Sub Mediant"],
  ["7도 화음", "이끎화음/Leading Tone"],
];
// 자연단음계의 7도는 이끎음(반음 아래)이 아니라 온음 아래라서 Subtonic
const minorDegrees = majorDegrees.slice(0, 6).concat([["7도 화음", "Subtonic"]]);
// [조, 조표, 1~7도 화음]
const majorKeys = [
  ["C장조",  "",      ["C",  "Dm",  "Em",  "F",  "G",  "Am",  "Bdim"]],
  ["D장조",  "##",    ["D",  "Em",  "F#m", "G",  "A",  "Bm",  "C#dim"]],
  ["E장조",  "####",  ["E",  "F#m", "G#m", "A",  "B",  "C#m", "D#dim"]],
  ["F장조",  "♭",     ["F",  "Gm",  "Am",  "B♭", "C",  "Dm",  "Edim"]],
  ["G장조",  "#",     ["G",  "Am",  "Bm",  "C",  "D",  "Em",  "F#dim"]],
  ["A장조",  "###",   ["A",  "Bm",  "C#m", "D",  "E",  "F#m", "G#dim"]],
  ["B장조",  "#####", ["B",  "C#m", "D#m", "E",  "F#", "G#m", "A#dim"]],
];
// 단조: 같은 줄 장조의 나란한조(6도에서 시작), 자연단음계 1~7도 화음 (i, ii°, III, iv, v, VI, VII)
const minorKeys = [
  ["A단조",  "",      ["Am",  "Bdim",  "C",  "Dm",  "Em",  "F",  "G"], "C장조"],
  ["B단조",  "##",    ["Bm",  "C#dim", "D",  "Em",  "F#m", "G",  "A"], "D장조"],
  ["C#단조", "####",  ["C#m", "D#dim", "E",  "F#m", "G#m", "A",  "B"], "E장조"],
  ["D단조",  "♭",     ["Dm",  "Edim",  "F",  "Gm",  "Am",  "B♭", "C"], "F장조"],
  ["E단조",  "#",     ["Em",  "F#dim", "G",  "Am",  "Bm",  "C",  "D"], "G장조"],
  ["F#단조", "###",   ["F#m", "G#dim", "A",  "Bm",  "C#m", "D",  "E"], "A장조"],
  ["G#단조", "#####", ["G#m", "A#dim", "B",  "C#m", "D#m", "E",  "F#"], "B장조"],
];

// 반음 위치: 이 번호(0부터) 칸의 오른쪽 경계가 반음. 장조 3-4·7-1도, 자연단음계 2-3·5-6도
const majorHalf = [2, 6];
const minorHalf = [1, 4];
const halfCls = (half, i) => half.includes(i) ? "half" : "";
// 145 악보에 쓰는 D·G·A장조: 1·4·5도(0부터 0·3·4번) 화음에 형광펜
const hlKeys = { "D장조": "hl-D", "G장조": "hl-G", "A장조": "hl-A" };
const hlDegrees = [0, 3, 4];
const chordHtml = (key, c, i) => {
  const t = c.replace(/dim$/, '<span class="dim">dim</span>');
  return hlKeys[key] && hlDegrees.includes(i) ? `<span class="hl ${hlKeys[key]}">${t}</span>` : t;
};

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
// 칸이 좁으니 긴 이름은 두 줄로: 한글은 "화음" 앞에서, 영어는 띄어쓰기에서 줄바꿈
const smallName = n => {
  if (!n.includes("/")) return esc(n);
  const [ko, en] = n.split("/");
  const k = ko.length > 4 ? ko.replace(/화음$/, "<br>화음") : ko;
  return k + "<br>" + esc(en).replace(/ /g, "<br>");
};
const headHtml = (degrees, half) =>
  `<tr><th class="corner"></th>${degrees.map(([d, n], i) => `<th class="${halfCls(half, i)}">${d.replace(" ", "<br>")}<small>${smallName(n)}</small></th>`).join("")}</tr>`;
const bodyHtml = (keys, half) => keys.map(([k, sig, chords, rel]) =>
  `<tr><th>${k}<span class="sig">${sig || "&nbsp;"}</span>${rel ? `<span class="rel">(${rel})</span>` : ""}</th>${chords.map((c, i) => `<td class="${halfCls(half, i)}">${chordHtml(k, c, i)}</td>`).join("")}</tr>`
).join("");
document.getElementById("majorHead").innerHTML = headHtml(majorDegrees, majorHalf);
document.getElementById("majorBody").innerHTML = bodyHtml(majorKeys, majorHalf);
document.getElementById("minorHead").innerHTML = headHtml(minorDegrees, minorHalf);
document.getElementById("minorBody").innerHTML = bodyHtml(minorKeys, minorHalf);
</script>
</body>
</html>
