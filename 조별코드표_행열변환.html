<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>조별 코드표 (행열 변환)</title>
<style>
  /* A4 세로 한 장에 맞춰 인쇄: 표가 페이지를 가득 채우고(세로로 길쭉하게) 글자를 칸 폭에 맞게 크게 */
  @page { size: A4; margin: 0; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { margin: 0; background: #fff; color: #000; font-family: "Malgun Gothic", "맑은 고딕", sans-serif; }
  .page { box-sizing: border-box; width: 210mm; height: 297mm; margin: 0 auto; padding: 8mm; overflow: hidden; }
  table { border-collapse: collapse; table-layout: fixed; width: 100%; height: 100%; }
  th, td { border: 1.5px solid #9aa3b5; text-align: center; vertical-align: middle; }
  thead th { background: #e3f0dc; font-size: 27px; font-weight: bold; padding: 6px 2px; line-height: 1.2; height: 19%; }
  thead th small { display: block; font-size: 18px; font-weight: normal; color: #333; line-height: 1.25; margin-top: 6px; white-space: nowrap; letter-spacing: -0.04em; }
  thead th.corner { background: #fff; border-top-color: #fff; border-left-color: #fff; width: 12%; }
  tbody th { background: #dfe5f5; font-size: 21px; padding: 4px 2px; line-height: 1.2; }
  tbody th .sig { display: block; font-size: 18px; letter-spacing: 2px; }
  td { font-size: 27px; }
  tr.strong td { font-weight: bold; }
</style>
</head>
<body>
<div class="page">
<table>
  <thead id="head"></thead>
  <tbody id="body"></tbody>
</table>
</div>
<script>
const degrees = [
  ["1도 화음", "으뜸화음/Tonic"],
  ["2도 화음", "윗으뜸화음/Super Tonic"],
  ["3도 화음", "가온화음/Mediant"],
  ["4도 화음", "버금딸림화음/Sub Dominant"],
  ["5도 화음", "딸림화음/Dominant"],
  ["6도 화음", "버금가온화음/Sub Mediant"],
  ["7도 화음", "이끎화음/Leading Tone"],
];
// [조, 조표, 1~7도 화음, 굵게 표시]
const keys = [
  ["C장조",  "",      ["C",  "Dm",  "Em",  "F",  "G",  "Am",  "Bdim"],  true],
  ["D장조",  "##",    ["D",  "Em",  "F#m", "G",  "A",  "Bm",  "C#dim"], false],
  ["E장조",  "####",  ["E",  "F#m", "G#m", "A",  "B",  "C#m", "D#dim"], true],
  ["F장조",  "♭",     ["F",  "Gm",  "Am",  "Bb", "C",  "Dm",  "Edim"],  false],
  ["G장조",  "#",     ["G",  "Am",  "Bm",  "C",  "D",  "Em",  "F#dim"], true],
  ["A장조",  "###",   ["A",  "Bm",  "C#m", "D",  "E",  "F#m", "G#dim"], false],
  ["Bb장조", "♭♭",    ["Bb", "Cm",  "Dm",  "Eb", "F",  "Gm",  "Adim"],  true],
  ["B장조",  "#####", ["B",  "C#m", "D#m", "E",  "F#", "G#m", "A#dim"], false],
];

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
// 칸이 좁으니 긴 이름은 두 줄로: 한글은 "화음" 앞에서, 영어는 띄어쓰기에서 줄바꿈
const smallName = n => {
  const [ko, en] = n.split("/");
  const k = ko.length > 4 ? ko.replace(/화음$/, "<br>화음") : ko;
  return k + "<br>" + esc(en).replace(/ /g, "<br>");
};
document.getElementById("head").innerHTML =
  `<tr><th class="corner"></th>${degrees.map(([d, n]) => `<th>${d.replace(" ", "<br>")}<small>${smallName(n)}</small></th>`).join("")}</tr>`;
document.getElementById("body").innerHTML = keys.map(([k, sig, chords, strong]) =>
  `<tr class="${strong ? "strong" : ""}"><th>${k}<span class="sig">${sig || "&nbsp;"}</span></th>${chords.map(c => `<td>${c}</td>`).join("")}</tr>`
).join("");
</script>
</body>
</html>
