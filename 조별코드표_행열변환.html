<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>조별 코드표 (행열 변환)</title>
<style>
  html, body { margin: 0; background: #fff; color: #000; font-family: "Malgun Gothic", "맑은 고딕", sans-serif; }
  .wrap { padding: 20px; display: inline-block; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid #9aa3b5; text-align: center; vertical-align: middle; }
  thead th { background: #e3f0dc; font-size: 15px; font-weight: bold; padding: 8px 6px; width: 118px; line-height: 1.4; }
  thead th small { display: block; font-size: 12px; font-weight: normal; color: #333; }
  thead th.corner { background: #fff; border-top-color: #fff; border-left-color: #fff; width: 90px; }
  tbody th { background: #dfe5f5; font-size: 16px; padding: 8px 12px; line-height: 1.3; }
  tbody th .sig { display: block; font-size: 14px; letter-spacing: 2px; }
  td { font-size: 16px; height: 46px; }
  tr.strong td { font-weight: bold; }
</style>
</head>
<body>
<div class="wrap">
<table>
  <thead id="head"></thead>
  <tbody id="body"></tbody>
</table>
</div>
<script>
const degrees = [
  ["1도 화음", "으뜸화음/Tonic"],
  ["2도 화음", "윗으뜸화음/Super Tonic"],
  ["3도 화음", "가온화음/Mediant"],
  ["4도 화음", "버금딸림화음/Sub Dominant"],
  ["5도 화음", "딸림화음/Dominant"],
  ["6도 화음", "버금가온화음/Sub Mediant"],
  ["7도 화음", "이끎화음/Leading Tone"],
];
// [조, 조표, 1~7도 화음, 굵게 표시]
const keys = [
  ["C장조",  "",      ["C",  "Dm",  "Em",  "F",  "G",  "Am",  "Bdim"],  true],
  ["D장조",  "##",    ["D",  "Em",  "F#m", "G",  "A",  "Bm",  "C#dim"], false],
  ["E장조",  "####",  ["E",  "F#m", "G#m", "A",  "B",  "C#m", "D#dim"], true],
  ["F장조",  "♭",     ["F",  "Gm",  "Am",  "Bb", "C",  "Dm",  "Edim"],  false],
  ["G장조",  "#",     ["G",  "Am",  "Bm",  "C",  "D",  "Em",  "F#dim"], true],
  ["A장조",  "###",   ["A",  "Bm",  "C#m", "D",  "E",  "F#m", "G#dim"], false],
  ["Bb장조", "♭♭",    ["Bb", "Cm",  "Dm",  "Eb", "F",  "Gm",  "Adim"],  true],
  ["B장조",  "#####", ["B",  "C#m", "D#m", "E",  "F#", "G#m", "A#dim"], false],
];

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
document.getElementById("head").innerHTML =
  `<tr><th class="corner"></th>${degrees.map(([d, n]) => `<th>${d}<small>(${esc(n)})</small></th>`).join("")}</tr>`;
document.getElementById("body").innerHTML = keys.map(([k, sig, chords, strong]) =>
  `<tr class="${strong ? "strong" : ""}"><th>${k}<span class="sig">${sig || "&nbsp;"}</span></th>${chords.map(c => `<td>${c}</td>`).join("")}</tr>`
).join("");
</script>
</body>
</html>
