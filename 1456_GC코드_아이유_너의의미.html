<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>너의 의미 - 아이유 (G·C 코드, 마디 정렬)</title>
<style>
  @page { size: A4; margin: 0; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  :root { --ly: 22px; --ch: 16px; --g: #0057B8; --c: #7A2FA8; --line: #555; }
  html, body { margin: 0; background: #fff; color: #000; font-family: "Malgun Gothic", "맑은 고딕", sans-serif; }
  .page { box-sizing: border-box; width: 210mm; height: 297mm; margin: 0 auto; padding: 8mm 4mm 6mm; overflow: hidden; }
  .title { position: relative; display: flex; justify-content: center; align-items: baseline; gap: 16px; margin-bottom: 14px; }
  /* 첫 마디가 바로 코드로 시작해 코드 안내를 넣을 빈 마디가 없으므로 제목 왼쪽 위에 표시 */
  .legend { position: absolute; left: 0; top: 0; font-size: 16px; font-weight: 800; line-height: 1.2; }
  h1 { font-size: 34px; margin: 0; }
  h2 { margin: 0; }
  /* 한 줄 = 같은 폭의 4마디 */
  .row { display: grid; grid-template-columns: repeat(var(--per-row), 1fr); margin-bottom: 8px; }
  .m { position: relative; display: flex; min-width: 0; }
  .part { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .ch { position: relative; border-bottom: 2px solid var(--line); padding: 0 0 3px 6px; }
  .ch i { display: block; height: calc(var(--ch) * 1.02); font-size: var(--ch); font-style: normal; font-weight: 800; line-height: 1; }
  .ch i.g { color: var(--g); }
  .ch i.c { color: var(--c); }
  /* 마디선: 가로줄을 가로지르는 짧은 세로선 */
  .m > .part:first-child .ch::before, .m.last > .part:last-child .ch::after { content: ""; position: absolute; bottom: -8px; height: 26px; width: 2px; background: var(--line); }
  .m > .part:first-child .ch::before { left: 0; }
  .m.last > .part:last-child .ch::after { right: 0; }
  .m.end > .part:last-child .ch::after { width: 4px; box-shadow: -6px 0 0 -1px var(--line); }
  /* 가사: 글자 간격을 살짝 좁히고 외곽선을 더해 더 크고 진하게 */
  .ly { display: flex; gap: 3px; padding: 6px 1px 0 3px; font-size: var(--ly); font-weight: bold; line-height: 1.15; white-space: nowrap; letter-spacing: -0.06em; word-spacing: -0.1em; -webkit-text-stroke: 0.05em #000; }
  .ly .next { margin-left: auto; text-align: right; }
  /* 가사를 폭은 그대로 두고 세로로만 늘림 (--sy 배) */
  .ly { height: calc(var(--ly) * 1.15 * var(--sy, 1)); }
  .ly span { display: inline-block; transform: scaleY(var(--sy, 1)); transform-origin: top; }
  /* 박자표: 마디선 바로 뒤에서 가로줄을 가운데에 두고 위아래로 숫자 표시 */
  .time { position: absolute; left: 6px; top: 100%; transform: translateY(-50%); font-size: calc(var(--ch) * 0.85); font-weight: bold; line-height: 1.25; text-align: center; }
  .has-time .ch, .has-time .ly { padding-left: calc(var(--ch) * 0.85 + 12px); }
  /* Fine, D.C. 표시: 마디 오른쪽 아래 */
  .mark { position: absolute; right: 0; top: 100%; text-align: center; line-height: 1; }
  .mark b { display: block; font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: calc(var(--ch) * 0.95); }
  .mark small { font-size: 12px; color: #333; }
  .note { margin-top: 26px; text-align: center; font-size: 17px; font-weight: bold; }
  .note b { font-family: Georgia, "Times New Roman", serif; font-style: italic; }
</style>
</head>
<body>
<div class="page">
  <div class="title"><div class="legend"></div><h1>너의 의미</h1><h2>아이유</h2></div>
  <div id="song"></div>
  <div class="note"><b>D.C.</b>까지 연주 후 처음으로 돌아가서 <b>Fine</b>까지 연주하고 끝낸다.</div>
</div>
<script>
// 한 줄에 4마디씩, 마디 폭은 모두 같게 표시 (여행을떠나요.png 형식)
// [코드]는 그 위치부터 적용(C코드 기준), 마디 가운데의 [코드]는 가사 길이에 맞춰 마디 뒤쪽에 표시
// " / " 뒤의 가사는 다음 마디로 이어지는 가사라서 마디 끝(오른쪽)에 붙여 표시
// 코드와 마디는 C코드_아이유_너의의미.jpg 기준
const TIME = "4/4";
const measures = [
  "[C]너의 그 [G7]한마디 말", "[F]도 / 그 웃음도", "[Am]나에겐 [C]커다란 의", "[G7]미",
  "[C]너의 그 [G7]작은 눈빛", "[F]도 / 쓸쓸한 뒷모습도", "[Am]나에겐 [C]힘겨운 약", "[G7]속",
  "[F]너의 모든 것은 [C]내게로", "[G7]와", "[F]풀리지 않는 수수 [C]께끼가 되", "[G7]네",
  "[Am]슬픔은 간이역에", "[F]코스모스로 피고", "[C]스쳐 불어온 넌 향긋", "[G7]한 바람",
  "[Am]나 이제 뭉게구름 위에", "[F]성을 짓고 / 널", "[C]향해 창을 내리 바람", "[G7]드는 창을",
];
// 마디 번호(0부터) → 마디 끝에 붙는 표시
const MARKS = { 7: ["Fine", "(피네) 끝"], 19: ["D.C.", "(다카포) 처음부터"] };
const rows = [];
// 한 줄에 4마디씩 표시
const PER_ROW = 4;
document.documentElement.style.setProperty("--per-row", PER_ROW);
for (let i = 0; i < measures.length; i += PER_ROW) rows.push(measures.slice(i, i + PER_ROW));

// C코드를 기준으로 반음 단위로 옮김 (C→G: +7)
const NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const FLAT = { Db: "C#", Eb: "D#", Gb: "F#", Ab: "G#", Bb: "A#" };
function transpose(chord, steps) {
  const m = chord.match(/^([A-G][#b]?)(.*)$/);
  const root = FLAT[m[1]] || m[1];
  return NOTES[(NOTES.indexOf(root) + steps + 12) % 12] + m[2];
}
const KEYS = [["g", 7, "G코드"], ["c", 0, "C코드"]];
// 7코드는 괄호로 감싸서 표시, 예: (G7)
const label = c => /7$/.test(c) ? `(${c})` : c;
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

document.querySelector(".legend").innerHTML = KEYS.map(([cls, , name]) => `<div style="color:var(--${cls})">${name}</div>`).join("");

const song = document.getElementById("song");
rows.forEach((measures, r) => {
  const row = document.createElement("div");
  row.className = "row";
  measures.forEach((text, i) => {
    const n = r * PER_ROW + i;
    const m = document.createElement("div");
    const isLastOfSong = r === rows.length - 1 && i === measures.length - 1;
    m.className = "m" + (i === measures.length - 1 ? " last" : "") + (isLastOfSong ? " end" : "");
    const parts = text.split(/(?=\[)/);
    parts.forEach((part, k) => {
      const [, chord, lyric] = part.match(/^\[([^\]]+)\]\s*(.*)$/);
      const [here, next] = lyric.split(/\s*\/\s*/);
      const p = document.createElement("div");
      const first = n === 0 && k === 0;
      p.className = "part" + (first ? " has-time" : "");
      // 마디 가운데서 코드가 바뀌면, 가사가 한 줄에 들어가도록 가사 길이에 비례해 폭을 나눔
      // (실제 가사 폭만큼 먼저 차지하고 남는 공간을 나눠 가짐)
      if (parts.length > 1) p.style.flex = "1 1 auto";
      const time = first ? `<span class="time">${TIME.replace("/", "<br>")}</span>` : "";
      p.innerHTML = `<div class="ch">${time}${KEYS.map(([cls, steps]) => `<i class="${cls}">${label(transpose(chord, steps))}</i>`).join("")}</div>`
        + `<div class="ly"><span>${esc(here)}</span>${next ? `<span class="next">${esc(next)}</span>` : ""}</div>`;
      m.appendChild(p);
    });
    if (MARKS[n]) m.insertAdjacentHTML("beforeend", `<div class="mark"><b>${MARKS[n][0]}</b><small>${MARKS[n][1]}</small></div>`);
    row.appendChild(m);
  });
  song.appendChild(row);
});

// 가사가 줄바꿈 없이 마디 안에 들어가고, A4 한 장의 높이에 맞는 가장 큰 글자 크기를 찾음
// 가사 크기는 마디 폭이, 코드 크기는 페이지 높이가 정하므로 둘을 따로 맞춤
const page = document.querySelector(".page");
const root = document.documentElement.style;
const lyEls = [...document.querySelectorAll(".ly")];
const chEls = [...document.querySelectorAll(".ch")];
function fits(ly, ch) {
  root.setProperty("--ly", ly + "px");
  root.setProperty("--ch", ch.toFixed(1) + "px");
  return [...document.querySelectorAll(".m")].every(m => m.scrollWidth <= m.clientWidth) && chEls.every(c => c.scrollWidth <= c.clientWidth) && lyEls.every(l => l.scrollWidth <= l.clientWidth) && page.scrollHeight <= page.clientHeight;
}
search:
for (let ly = 44; ly >= 9; ly -= 0.25) {
  for (let ch = Math.min(34, ly * 2); ch >= ly * 0.7; ch -= 0.5) {
    if (fits(ly, ch)) break search;
  }
}

// 가로 폭은 위에서 정한 크기 그대로 두고, 페이지 높이에 맞는 만큼 가사를 세로로 늘림 (최대 1.7배)
for (let sy = 1.7; sy > 1; sy -= 0.05) {
  root.setProperty("--sy", sy.toFixed(2));
  if (page.scrollHeight <= page.clientHeight) break;
}

// 줄이 적어 아래가 비면, 남는 높이를 줄 사이에 고르게 나눠 페이지를 채움
const rowEls = [...document.querySelectorAll(".row")];
const pageBottom = page.getBoundingClientRect().bottom - parseFloat(getComputedStyle(page).paddingBottom);
const free = pageBottom - document.querySelector(".note").getBoundingClientRect().bottom;
const extra = Math.min(70, free / (rowEls.length + 1));
rowEls.forEach(r => r.style.marginBottom = `${8 + extra}px`);
</script>
</body>
</html>
